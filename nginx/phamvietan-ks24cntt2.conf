# nginx/phamvietan-ks24cntt2.conf
server {
    listen      8080;
    listen      [::]:8080;

    server_name crouan;   
    root        /var/www/devops-hackathon-de004-phamvietan/src;
    index       index.html;

    access_log  /var/log/nginx/phamvietan-ks24cntt2.access.log;
    error_log   /var/log/nginx/phamvietan-ks24cntt2.error.log;

    location / {
        allow all;
        try_files $uri $uri/ =404;
    }
}
